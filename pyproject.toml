[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "todo-api"
version = "0.1.0"
description = "FastAPI Todo-API -- CI/CT/CD Demonstrator"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1.0,<4.0.0",
]

# --- Dev-Dependencies (PEP 735 Dependency Groups) ---
# uv nutzt dependency-groups statt optional-dependencies für Dev-Tools.
# "uv sync --group dev" installiert diese automatisch.
[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pre-commit>=3.7.0,<5.0.0",
    "ruff>=0.5.0,<1.0.0",
    "black>=24.0.0,<25.0.0",
    "pip-audit>=2.7.0,<3.0.0",
]

# --- Tool Configuration ---

[tool.black]
target-version = ["py310"]
line-length = 88

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
fail_under = 80
