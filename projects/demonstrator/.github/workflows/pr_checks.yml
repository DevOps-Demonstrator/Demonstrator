name: PR Checks

# --- Konzept: Prozessqualität (aus Djangos Community-Workflows) ---
# Django prüft mit 3 Workflows die Qualität von PRs und Commits:
#   - labels.yml:                Auto-Label wenn Trac-Ticket fehlt
#   - check_pr_quality.yml:      PR-Beschreibung, Checkliste, Ticket-Status
#   - check_commit_messages.yml: Commit-Message-Konventionen
#
# Der Demonstrator kombiniert die für Studenten-Projekte relevanten Checks
# in einem einzigen Workflow, angepasst auf GitHub Issues statt Trac.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # --- Konzept: Ticket-Referenz prüfen (aus Djangos labels.yml) ---
  # Django prüft, ob der PR-Titel eine Trac-Ticketnummer enthält.
  # Der Demonstrator prüft auf GitHub-Issue-Referenzen (#123).
  ticket-reference:
    name: Issue Reference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for issue reference and manage labels
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const body = context.payload.pull_request.body || '';
            const regex = /#[0-9]+/;
            const label = 'no ticket';
            const hasRef = regex.test(title) || regex.test(body);
            const labels = context.payload.pull_request.labels.map(l => l.name);

            if (hasRef && labels.includes(label)) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: label
              });
              console.log(`Removed "${label}" label -- issue reference found.`);
            } else if (!hasRef && !labels.includes(label)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [label]
              });
              core.warning(
                'PR title or body should reference a GitHub Issue (e.g. #42). ' +
                'Label "no ticket" was added.'
              );
            }

  # --- Konzept: PR-Beschreibung prüfen (aus Djangos check_pr_quality.yml) ---
  # Django prüft u.a. ob eine aussagekräftige Beschreibung vorhanden ist
  # (mind. 5 Wörter). Der Demonstrator übernimmt das vereinfacht.
  pr-description:
    name: PR Description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const trimmed = body.trim();
            const wordCount = trimmed.split(/\s+/).filter(w => w.length > 0).length;

            if (trimmed.length === 0) {
              core.setFailed('PR description is empty. Please describe what this PR does and why.');
            } else if (wordCount < 5) {
              core.setFailed(
                `PR description is too short (${wordCount} words). ` +
                'Please provide at least 5 words describing the change.'
              );
            } else {
              console.log(`PR description OK (${wordCount} words).`);
            }
