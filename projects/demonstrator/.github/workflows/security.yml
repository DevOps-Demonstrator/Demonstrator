name: Security

# --- Konzept: Supply-Chain-Security ---
# Django scannt seine CI-Workflows mit zizmor auf Sicherheitslücken.
# Der Demonstrator wendet dasselbe Prinzip auf Abhängigkeiten an:
# pip-audit prüft alle installierten Pakete gegen bekannte Schwachstellen
# (CVE-Datenbanken wie PyPI Advisory Database und OSV).
on:
  push:
    branches: [main]
  pull_request:
  # --- Konzept: Geplante Ausführung (wie Djangos schedules.yml) ---
  # Wöchentlicher Scan für neu entdeckte Schwachstellen in bestehenden
  # Abhängigkeiten -- auch ohne Code-Änderungen.
  schedule:
    - cron: "0 8 * * 1"  # Jeden Montag um 08:00 UTC
  # Manuell auslösbar (wie bei Djangos schedule_tests.yml)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: pip-audit (Dependency Scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Audit dependencies
        run: uv run pip-audit
