repos:
  # Python: Code-Formatierung (Einrückung, Zeilenlänge, Klammern, ...)
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.10.0
    hooks:
      - id: black

  # Python: Linting (statische Code-Analyse auf Fehler und Stil) + Import-Sortierung (ersetzt flake8 + isort)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix]

  # JavaScript: Linting (Frontend)
  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v0.16.10
    hooks:
      - id: oxlint
        files: ^frontend/.*\.(js|jsx)$

  # GitHub Actions: Workflow-Security (unpinned Actions, dangerous Triggers, excessive Permissions)
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.26.1
    hooks:
      - id: zizmor
