# --- Docker Compose für Produktion (Swarm Mode) ---
#
# 3 Services: nginx (Frontend) + api (FastAPI) + db (PostgreSQL)
#
# Unterschiede zu docker-compose.yml (Entwicklung):
#   - "image:" statt "build:" -- Swarm kann nicht bauen, nur fertige Images pullen
#   - "deploy:" Sektion -- Replicas, Rolling Updates, Restart-Policy
#   - DB-Port nicht exponiert (nur internes Netzwerk)
#   - nginx als Entrypoint (Port 80) -- leitet API-Requests an den Backend-Service
#
# Voraussetzungen auf dem Server:
#   docker swarm init
#   docker login ghcr.io -u <user> -p <token>
#
# Deployment:
#   docker stack deploy -c docker-compose.prod.yml todo-api

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s

  api:
    image: ${API_IMAGE:-ghcr.io/OWNER/REPO:latest}
    environment:
      DATABASE_URL: "postgresql+psycopg://todo:todo@db:5432/todo"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/OWNER/REPO-frontend:latest}
    ports:
      - "80:80"
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

volumes:
  pgdata:
