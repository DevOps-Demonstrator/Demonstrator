name: Linters

# --- Konzept: Trigger ---
# Läuft bei jedem Push auf main und bei jedem Pull Request.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"

# --- Konzept: Least Privilege ---
permissions:
  contents: read

# --- Konzept: Concurrency Control ---
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Konzept: "Trust but verify" ---
  # Dieselben Prüfungen wie lokal (Pre-Commit), aber als Sicherheitsnetz in der CI.
  # 4 parallele Jobs: Black, Ruff, oxlint (Frontend), zizmor.
  black:
    name: Black (Formatting)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Check formatting
        run: uvx black --check --diff .

  ruff:
    name: Ruff (Linting)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Check linting + imports
        run: uvx ruff check --output-format=github .

  # --- Konzept: Frontend-Linting ---
  # oxlint (Vite-Standard)
  frontend:
    name: Frontend (Lint + Build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # --- Konzept: Supply-Chain-Security ---
  # zizmor scannt die GitHub Actions Workflow-Dateien selbst auf Sicherheitsprobleme: unpinned Actions, dangerous Triggers, excessive Permissions, etc.
  zizmor:
    name: zizmor (Workflow Security)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
