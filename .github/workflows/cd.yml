name: CD

# --- Konzept: CD-Trigger ---
# Nur bei Pushes auf main (nicht bei PRs).
# GH Branch Protection Rules stellen sicher, dass main nur Code enthält, der alle CI-Checks (Linters, Tests, Security) bestanden hat.

on:
  push:
    branches: [main]

# --- Konzept: Least Privilege ---
permissions:
  contents: read

# --- Konzept: Concurrency Control ---
# cancel-in-progress: false - laufende Deployments nicht abbrechen, da ein halb-gepushtes Image problematisch wäre.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --- API-Image (FastAPI + Python) ---
  build-api:
    name: Build & Push API Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Konzept: Reproduzierbare Builds ---
      # Jedes Image bekommt zwei Tags:
      # - latest: Immer die aktuellste Version auf main.
      # - <sha>: Eindeutige, unveränderliche Referenz (Hash) auf genau diesen Build.
      - name: Build and push API
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # --- Frontend-Image (React + nginx) ---
  build-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}-frontend:latest
            ghcr.io/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}

  # --- Deployment via SSH + Docker Swarm ---
  # needs: wartet bis BEIDE Images erfolgreich gebaut und gepusht sind.
  # Schlägt ein Build fehl, wird nicht deployed.
  deploy:
    name: Deploy to Swarm
    needs: [build-api, build-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name (lowercase)
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # --- Konzept: Deployment via SSH ---
      # Der Workflow verbindet sich per SSH mit dem Swarm Manager und führt "docker stack deploy" aus. 
      # Das Compose-File wird per scp auf den Server kopiert.
      #
      # Benötigte GitHub Secrets:
      #   DEPLOY_HOST     - IP/Hostname des Swarm Managers
      #   DEPLOY_USER     - SSH-Benutzer
      #   DEPLOY_SSH_KEY  - Privater SSH-Key
      - name: Copy compose file to server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/todo-api/"

      - name: Deploy stack via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: API_IMAGE,FRONTEND_IMAGE
          script: |
            cd ~/todo-api

            # Neue Images pullen
            docker pull "$API_IMAGE"
            docker pull "$FRONTEND_IMAGE"

            # Stack deployen (Swarm führt Rolling Update durch)
            docker stack deploy -c docker-compose.prod.yml todo-api

            # Warten bis die Services gesund sind
            echo "Waiting for services to become healthy..."
            sleep 15
            docker service ls
        env:
          API_IMAGE: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/${{ env.IMAGE_NAME }}-frontend:${{ github.sha }}
