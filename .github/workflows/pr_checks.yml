name: PR Checks

# --- Konzept: Prozessqualität ---
# Qualität von PRs (GitHub Issues) prüfen.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # --- Konzept: Ticket-Referenz prüfen ---
  # Auf GitHub-Issue-Referenzen (#123) prüfen.
  ticket-reference:
    name: Issue Reference
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check for issue reference and manage labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = context.payload.pull_request.title;
            const body = context.payload.pull_request.body || '';
            const regex = /#[0-9]+/;
            const label = 'no ticket';
            const hasRef = regex.test(title) || regex.test(body);
            const labels = context.payload.pull_request.labels.map(l => l.name);

            if (!hasRef) {
              // Label setzen falls noch nicht vorhanden
              if (!labels.includes(label)) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  labels: [label]
                });
              }
              core.setFailed(
                'PR title or body must reference a GitHub Issue (e.g. #42 or Closes #42). ' +
                'Label "no ticket" was added.'
              );
            } else {
              // Label entfernen falls vorhanden
              if (labels.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  name: label
                });
              }
              console.log('Issue reference found.');
            }

  # --- Konzept: PR-Beschreibung prüfen ---
  # Prüfen, ob eine aussagekräftige Beschreibung vorhanden ist (mind. 5 Wörter).
  pr-description:
    name: PR Description
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR description
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const trimmed = body.trim();
            const wordCount = trimmed.split(/\s+/).filter(w => w.length > 0).length;

            if (trimmed.length === 0) {
              core.setFailed('PR description is empty. Please describe what this PR does and why.');
            } else if (wordCount < 5) {
              core.setFailed(
                `PR description is too short (${wordCount} words). ` +
                'Please provide at least 5 words describing the change.'
              );
            } else {
              console.log(`PR description OK (${wordCount} words).`);
            }
