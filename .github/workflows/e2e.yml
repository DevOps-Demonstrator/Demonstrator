name: E2E Tests

# --- Konzept: On-Demand-Testing ---
# Playwright-Browsertests.
on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
    paths-ignore:
      - "docs/**"
      - "*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # --- Konzept: Label-gated ---
    # Job läuft nur wenn das Label "e2e" gesetzt ist.
    if: contains(github.event.pull_request.labels.*.name, 'e2e')
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --- Backend starten ---
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install backend
        run: uv sync --frozen --group dev

      - name: Start API server
        run: uv run uvicorn app.main:app --port 8000 &
        env:
          DATABASE_URL: "sqlite:///./test_e2e.db"

      # --- Frontend starten ---
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      # --- E2E-Tests ausführen ---
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e #test:e2e bezieht sich auf das in der package.json definierte Skript bzw dahinter liegende Kommando 

      # --- Konzept: Artefakte bei Fehler (wie Djangos screenshots.yml) ---
      # Playwright lädt Screenshots hoch bei fehlgeschlagenen Tests.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.event.pull_request.head.sha }}
          path: frontend/test-results/
          retention-days: 7
