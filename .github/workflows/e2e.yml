name: E2E Tests

# --- Konzept: On-Demand-Testing ---
# Playwright-Browsertests.
on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
    paths-ignore:
      - "docs/**"
      - "*.md"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # --- Konzept: Label-gated (wie bei Django) ---
    # Job läuft nur wenn das Label "e2e" gesetzt ist.
    if: contains(github.event.pull_request.labels.*.name, 'e2e')
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # --- Backend starten ---
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install backend
        run: uv sync --frozen --group dev

      - name: Start API server
        run: uv run uvicorn app.main:app --port 8000 &
        env:
          DATABASE_URL: "sqlite:///./test_e2e.db"

      # --- Frontend starten ---
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      # --- E2E-Tests ausführen ---
      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      # --- Konzept: Artefakte bei Fehler (wie Djangos screenshots.yml) ---
      # Playwright lädt Screenshots hoch bei fehlgeschlagenen Tests.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.event.pull_request.head.sha }}
          path: frontend/test-results/
          retention-days: 7
