name: Security

# --- Konzept: Supply-Chain-Security ---
# Abhängigkeiten auf Sicherheitslücken scannen: pip-audit prüft alle installierten Pakete gegen bekannte Schwachstellen (CVE-Datenbanken wie PyPI Advisory Database und OSV).
on:
  push:
    branches: [main]
  pull_request:
  # --- Konzept: Geplante Ausführung ---
  # Wöchentlicher Scan für neu entdeckte Schwachstellen in bestehenden Abhängigkeiten.
  schedule:
    - cron: "0 8 * * 1"  # Jeden Montag um 08:00 UTC
  # Auch manuell auslösbar 
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: pip-audit (Dependency Scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Audit dependencies
        run: uv run pip-audit
