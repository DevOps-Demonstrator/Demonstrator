name: Security

# --- Konzept: Supply-Chain-Security ---
# Abhängigkeiten auf Sicherheitslücken scannen: pip-audit prüft alle installierten Pakete gegen bekannte Schwachstellen (CVE-Datenbanken wie PyPI Advisory Database und OSV).
on:
  push:
    branches: [main]
  pull_request:
  # --- Konzept: Geplante Ausführung ---
  # Wöchentlicher Scan für neu entdeckte Schwachstellen in bestehenden Abhängigkeiten.
  schedule:
    - cron: "0 8 * * 1"  # Jeden Montag um 08:00 UTC
  # Auch manuell auslösbar 
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: pip-audit (Dependency Scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Audit dependencies
        run: uv run pip-audit
