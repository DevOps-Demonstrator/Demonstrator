# --- Konzept: Automatisierte Dependency-Updates ---
# Dependabot erstellt automatisch PRs, wenn Abhängigkeiten veraltet sind.
# Ergänzt pip-audit (findet Schwachstellen) um proaktive Updates.
version: 2

updates:
  # Python-Abhängigkeiten (pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"

  # GitHub Actions Versionen
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"

  # Frontend-Abhängigkeiten (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps(frontend)"
    labels:
      - "dependencies"
      - "frontend"

  # Docker Base-Images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "docker"
    labels:
      - "docker"
